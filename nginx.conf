server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA (react-router): cualquier ruta que no sea un archivo real cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia la API OData del backend (.NET) en el mismo VPS/red de Podman.
    # Ajustar host:puerto al nombre del contenedor/servicio backend real.
    location /odata/ {
        proxy_pass         http://muric-backend:8080/odata/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Proxy hacia la API de Security/Auth del backend.
    location /api/ {
        proxy_pass         http://muric-backend:8080/api/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Cache largo para assets con hash generados por Vite
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
